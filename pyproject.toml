[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench"
version = "1.7.0"
description = "macOS 桌面应用：管理本机项目，每个任务交给一个 Claude 或 Codex 主会话执行"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.5"]

[project.gui-scripts]
ai-workbench = "workbench.desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbench = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
